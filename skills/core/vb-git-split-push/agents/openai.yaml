interface:
  display_name: "Vb Git Split Push"
  short_description: "Commit, merge and push without quality verification"
  default_prompt: "Use $vb-git-split-push to group existing changes into Conventional Commits, automatically merge the exact current-branch remote when low risk, and precisely push. Do not run quality verification or repair code. Obtain user authorization before high-risk merges; preserve independent safety checks and report actual Git results without claiming tests passed."
policy:
  allow_implicit_invocation: false
