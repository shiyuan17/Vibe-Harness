interface:
  display_name: "Vb Git Split Push"
  short_description: "Group existing changes, sync and push the current branch"
  default_prompt: "Use $vb-git-split-push to group existing changes into self-contained Conventional Commits, validate each staged snapshot, repair known in-scope formatting errors through the original hooks, then sync and push the current branch including develop."
policy:
  allow_implicit_invocation: false
