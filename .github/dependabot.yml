version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directories:
      - "/runtime/tools/ast-grep"
      - "/runtime/tools/chrome-devtools-mcp"
      - "/runtime/tools/codebase-memory-mcp"
      - "/runtime/tools/open-code-review"
      - "/runtime/tools/playwright-cli"
      - "/runtime/tools/rtk"
    schedule:
      interval: "weekly"
