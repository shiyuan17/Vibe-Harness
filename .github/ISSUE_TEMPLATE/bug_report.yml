name: Bug 报告
description: 报告可复现的缺陷或回归
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，避免重复。
        安全问题请改用 SECURITY.md 中的私密报告入口，不要在这里公开。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际行为与预期行为的差异。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出最小、可复现的命令或步骤及输入。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: Vibe-Harness 版本、提交 SHA 或安装 profile。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js 与 pnpm 版本、宿主（Codex/Claude/Gemini 等）。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 命令输出、退出码或日志片段；请先脱敏。
    validations:
      required: false
