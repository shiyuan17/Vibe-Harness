name: 功能请求
description: 提议新的规则、Skill、adapter 或工作流能力
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前能力缺口、触发场景和影响范围。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、边界和可验收结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的替代做法及其取舍。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - rules
        - skills
        - templates
        - installer / adapters
        - runtime / hooks
        - evals
        - docs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue 和文档，未发现重复。
          required: true
        - label: 这不是应通过 SECURITY.md 私密报告的安全问题。
          required: true
