name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verification-id: ${{ steps.metadata.outputs.id }}
      verification-finished-at: ${{ steps.metadata.outputs.finished_at }}
      verified-sha: ${{ steps.metadata.outputs.sha }}
      verification-stable: ${{ steps.metadata.outputs.stable }}
      verification-checks: ${{ steps.metadata.outputs.checks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:audit
      - run: pnpm eval:check
      - run: pnpm eval:replay
      - run: pnpm test:eval
      - run: pnpm test:integration
      - run: pnpm smoke:lifecycle
      - run: pnpm runtime:audit
      - run: pnpm pack:contract
      - run: pnpm pack --pack-destination release-artifacts
      - id: metadata
        run: node scripts/release-verification-metadata.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ github.sha }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

  release-please:
    needs: release-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
          package-name: "@jw/vibe-harness"
          changelog-sections: |
            [
              { "type": "feat", "section": "Features" },
              { "type": "fix", "section": "Bug Fixes" },
              { "type": "eval", "section": "Evals" },
              { "type": "perf", "section": "Performance Improvements" },
              { "type": "revert", "section": "Reverts" },
              { "type": "docs", "section": "Documentation" },
              { "type": "refactor", "section": "Code Refactoring" },
              { "type": "test", "section": "Tests" },
              { "type": "chore", "section": "Miscellaneous Chores" },
              { "type": "build", "section": "Build System" },
              { "type": "ci", "section": "Continuous Integration" }
            ]

  publish-assets:
    if: needs.release-please.outputs.release-created == 'true'
    needs: [release-verify, release-please]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release-${{ needs.release-verify.outputs.verified-sha }}
          path: release-artifacts
      - name: Verify release SHA
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          VERIFIED_SHA: ${{ needs.release-verify.outputs.verified-sha }}
        run: test "$RELEASE_SHA" = "$VERIFIED_SHA"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*.tgz
      - name: Generate release evidence and checksum
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          VERIFIED_SHA: ${{ needs.release-verify.outputs.verified-sha }}
          VERIFICATION_ID: ${{ needs.release-verify.outputs.verification-id }}
          VERIFICATION_FINISHED_AT: ${{ needs.release-verify.outputs.verification-finished-at }}
          VERIFICATION_STABLE: ${{ needs.release-verify.outputs.verification-stable }}
          VERIFICATION_CHECKS: ${{ needs.release-verify.outputs.verification-checks }}
          TARBALL_DIR: release-artifacts
          ATTESTATION_STATUS: generated
          RELEASE_EVIDENCE_PATH: release-artifacts/release-evidence.json
          CHECKSUM_PATH: release-artifacts/SHA256SUMS
        run: node scripts/release-evidence.js
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS release-artifacts/release-evidence.json
