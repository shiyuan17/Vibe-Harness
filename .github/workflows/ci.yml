name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm eval:check
      - run: pnpm eval:offline
      - run: pnpm test:integration
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm runtime:audit
      - run: pnpm eval:changes --base "$BASE_SHA"
        shell: bash
      - name: Show evaluation reference changes
        run: git diff --name-only "$BASE_SHA" HEAD -- evals/references || true
        shell: bash
      - run: pnpm smoke:lifecycle
      - run: git diff --check

