name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm eval:check
      - run: pnpm eval:offline
      - run: pnpm eval:changes --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Show evaluation reference changes
        run: git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD -- evals/references || true
      - run: pnpm smoke:lifecycle
      - run: git diff --check

