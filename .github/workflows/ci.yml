name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm eval:check
      - run: pnpm eval:offline
      - run: pnpm test:integration
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm runtime:audit
      - run: pnpm eval:changes --base "$BASE_SHA"
        shell: bash
      - name: Show evaluation reference changes
        run: git diff --name-only "$BASE_SHA" HEAD -- evals/references || true
        shell: bash
      - run: pnpm smoke:lifecycle
      - run: git diff --check

