name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-plan:
    name: change plan
    runs-on: ubuntu-latest
    outputs:
      riskLevel: ${{ steps.plan.outputs.riskLevel }}
      integration: ${{ steps.plan.outputs.integration }}
      smoke: ${{ steps.plan.outputs.smoke }}
      supplyChain: ${{ steps.plan.outputs.supplyChain }}
      full: ${{ steps.plan.outputs.full }}
      lint: ${{ steps.plan.outputs.lint }}
      validate: ${{ steps.plan.outputs.validate }}
      unit: ${{ steps.plan.outputs.unit }}
      component: ${{ steps.plan.outputs.component }}
      eval: ${{ steps.plan.outputs.eval }}
      evalCheck: ${{ steps.plan.outputs.evalCheck }}
      docs: ${{ steps.plan.outputs.docs }}
      skills: ${{ steps.plan.outputs.skills }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      FORCE_FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: pnpm verify:plan

  risk-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - run: node scripts/risk-evidence.js

  # The three conformance gates below only make sense for a pull request. They
  # run on every pull_request event, but merge-gate is the only required check
  # and it is configured on main, so a develop pull request is never blocked by
  # them (ADR-0006: develop merges need neither remote CI nor approval).
  branch-policy:
    name: branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: node scripts/branch-policy.js

  independent-review:
    name: independent review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - run: node scripts/independent-review.js

  high-risk-approval:
    name: high-risk approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pull-request-approval.js

  fast-gate:
    name: fast gate (${{ matrix.os }})
    if: needs.change-plan.result == 'success' && needs.change-plan.outputs.full != 'true'
    needs: change-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:eslint
      - run: pnpm typecheck
      - if: needs.change-plan.outputs.lint == 'true'
        run: pnpm lint
      - if: needs.change-plan.outputs.validate == 'true'
        run: pnpm validate
      - if: needs.change-plan.outputs.unit == 'true'
        run: pnpm test:unit
      - if: needs.change-plan.outputs.component == 'true'
        run: pnpm test:component
      - if: needs.change-plan.outputs.unit == 'true'
        run: pnpm tests:catalog check --observed .vibe-harness/observed-tests/unit.json
      - if: needs.change-plan.outputs.component == 'true'
        run: pnpm tests:catalog check --observed .vibe-harness/observed-tests/component.json
      - if: needs.change-plan.outputs.evalCheck == 'true'
        run: pnpm eval:check
      - if: needs.change-plan.outputs.evalCheck == 'true'
        run: pnpm eval:harness check
      - if: needs.change-plan.outputs.evalCheck == 'true'
        run: pnpm eval:harness plan --tier fast
      - if: needs.change-plan.outputs.eval == 'true'
        run: pnpm eval:replay
      - if: needs.change-plan.outputs.docs == 'true'
        run: pnpm docs:audit
      - if: needs.change-plan.outputs.skills == 'true'
        run: pnpm skills:audit
      - run: git diff --check

  integration-gate:
    name: integration gate (${{ matrix.os }})
    if: needs.change-plan.result == 'success' && needs.change-plan.outputs.integration == 'true' && needs.change-plan.outputs.full != 'true'
    needs: change-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm tests:catalog check --observed .vibe-harness/observed-tests/integration.json

  smoke-gate:
    name: smoke gate
    if: needs.change-plan.result == 'success' && needs.change-plan.outputs.smoke == 'true' && needs.change-plan.outputs.full != 'true'
    needs: change-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:lifecycle

  supply-chain:
    if: needs.change-plan.result == 'success' && (needs.change-plan.outputs.supplyChain == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: change-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:audit
      - run: pnpm skills:audit
      - run: pnpm pack:contract

  security:
    name: security scan
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  full-gate:
    name: full gate (${{ matrix.os }})
    if: needs.change-plan.result == 'success' && needs.change-plan.outputs.full == 'true'
    needs: change-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: windows-latest
            node-version: 22.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm eval:check
      - run: pnpm eval:harness check
      - run: pnpm eval:harness plan --tier fast
      - run: pnpm eval:replay
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:matrix
      - run: pnpm tests:catalog check --observed .vibe-harness/observed-tests/unit.json --observed .vibe-harness/observed-tests/component.json --observed .vibe-harness/observed-tests/integration.json --observed .vibe-harness/observed-tests/e2e.json --observed .vibe-harness/observed-tests/matrix.json
      - run: pnpm smoke:lifecycle
      - run: git diff --check

  product:
    if: always()
    needs: [change-plan, fast-gate, integration-gate, smoke-gate, full-gate]
    runs-on: ubuntu-latest
    env:
      CHANGE_PLAN_RESULT: ${{ needs.change-plan.result }}
      FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
      REQUIRED_FAST_GATE_RESULT: ${{ needs.change-plan.outputs.full != 'true' }}
      INTEGRATION_GATE_RESULT: ${{ needs.integration-gate.result }}
      REQUIRED_INTEGRATION_GATE_RESULT: ${{ needs.change-plan.outputs.integration == 'true' && needs.change-plan.outputs.full != 'true' }}
      SMOKE_GATE_RESULT: ${{ needs.smoke-gate.result }}
      REQUIRED_SMOKE_GATE_RESULT: ${{ needs.change-plan.outputs.smoke == 'true' && needs.change-plan.outputs.full != 'true' }}
      FULL_GATE_RESULT: ${{ needs.full-gate.result }}
      REQUIRED_FULL_GATE_RESULT: ${{ needs.change-plan.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: node scripts/merge-gate.js

  merge-gate:
    if: always()
    needs: [change-plan, product, supply-chain, risk-evidence, branch-policy, independent-review, high-risk-approval]
    runs-on: ubuntu-latest
    env:
      PRODUCT_RESULT: ${{ needs.product.result }}
      SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
      REQUIRED_SUPPLY_CHAIN_RESULT: ${{ needs.change-plan.outputs.supplyChain == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      RISK_EVIDENCE_RESULT: ${{ needs.risk-evidence.result }}
      CHANGE_PLAN_RESULT: ${{ needs.change-plan.result }}
      BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
      REQUIRED_BRANCH_POLICY_RESULT: ${{ github.event_name == 'pull_request' }}
      HIGH_RISK_REVIEW_RESULT: ${{ needs.independent-review.result }}
      REQUIRED_HIGH_RISK_REVIEW_RESULT: ${{ github.event_name == 'pull_request' }}
      HIGH_RISK_APPROVAL_RESULT: ${{ needs.high-risk-approval.result }}
      REQUIRED_HIGH_RISK_APPROVAL_RESULT: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: node scripts/merge-gate.js
