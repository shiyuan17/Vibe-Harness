name: Online evaluation canaries

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: preflight
        env:
          CODEX_CLI_VERSION: ${{ vars.CODEX_CLI_VERSION }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_CLI_VERSION" ] || [ -z "$CODEX_MODEL" ] || [ -z "$OPENAI_API_KEY" ]; then
            mkdir -p .loopengine/evals/runs
            printf '{"status":"degraded","code":"EVAL_RUNNER_CONFIG_MISSING"}\n' > .loopengine/evals/runs/degraded.json
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: codex-install
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          CODEX_CLI_VERSION: ${{ vars.CODEX_CLI_VERSION }}
        run: npm install --global "@openai/codex@$CODEX_CLI_VERSION"
      - if: steps.preflight.outputs.ready == 'true' && steps.codex-install.outcome == 'failure'
        run: |
          mkdir -p .loopengine/evals/runs
          printf '{"status":"degraded","code":"EVAL_RUNNER_INSTALL_FAILED"}\n' > .loopengine/evals/runs/degraded.json
      - if: steps.preflight.outputs.ready == 'true' && steps.codex-install.outcome == 'success'
        env:
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          LOOPENGINE_EVAL_ENFORCE: ${{ vars.LOOPENGINE_EVAL_ENFORCE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm eval:online
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loopengine-online-evals-${{ github.run_id }}
          path: .loopengine/evals/runs/*.json
          retention-days: 30
          if-no-files-found: error
