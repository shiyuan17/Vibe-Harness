name: Online evaluation canaries

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  codex-canary:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CODEX_CLI_VERSION: "\u0024{{ vars.CODEX_CLI_VERSION }}"
      CODEX_MODEL: "\u0024{{ vars.CODEX_MODEL }}"
      CODEX_REASONING_EFFORT: "\u0024{{ vars.CODEX_REASONING_EFFORT || 'medium' }}"
      OPENAI_API_KEY: "\u0024{{ secrets.OPENAI_API_KEY }}"
      OPENAI_BASE_URL: "\u0024{{ vars.OPENAI_BASE_URL }}"
      VIBE_HARNESS_EVAL_CODEX_BACKEND: native
      VIBE_HARNESS_EVAL_ENFORCE: "\u0024{{ vars.VIBE_HARNESS_EVAL_ENFORCE }}"
      VIBE_HARNESS_EVAL_PROVIDER_NAME: "\u0024{{ vars.VIBE_HARNESS_EVAL_PROVIDER_NAME || 'vibe-harness-env' }}"
      VIBE_HARNESS_EVAL_PROVIDER_WIRE_API: "\u0024{{ vars.VIBE_HARNESS_EVAL_PROVIDER_WIRE_API || 'responses' }}"
      VIBE_HARNESS_EVAL_REQUIRE_BASE_URL: '1'
      VIBE_HARNESS_EVAL_RUNTIME_SOURCE: env
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: preflight
        env:
          CODEX_CLI_VERSION: ${{ vars.CODEX_CLI_VERSION }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_CLI_VERSION" ] || [ -z "$CODEX_MODEL" ] || [ -z "$OPENAI_API_KEY" ]; then
            mkdir -p .vibe-harness/evals/runs
            printf '{"status":"degraded","code":"EVAL_RUNNER_CONFIG_MISSING"}\n' > .vibe-harness/evals/runs/degraded.json
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: codex-install
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          CODEX_CLI_VERSION: ${{ vars.CODEX_CLI_VERSION }}
        run: npm install --global "@openai/codex@$CODEX_CLI_VERSION"
      - if: steps.preflight.outputs.ready == 'true' && steps.codex-install.outcome == 'failure'
        run: |
          mkdir -p .vibe-harness/evals/runs
          printf '{"status":"degraded","code":"EVAL_RUNNER_INSTALL_FAILED"}\n' > .vibe-harness/evals/runs/degraded.json
      - id: online-eval
        if: steps.preflight.outputs.ready == 'true' && steps.codex-install.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          VIBE_HARNESS_EVAL_ENFORCE: ${{ vars.VIBE_HARNESS_EVAL_ENFORCE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm eval:online
      - name: Download recent online evaluation health artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .vibe-harness/evals/history
          gh run list --workflow evals.yml --branch "$GITHUB_REF_NAME" --status completed --limit 21 --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            [ -z "$run_id" ] && continue
            mkdir -p ".vibe-harness/evals/history/$run_id"
            gh run download "$run_id" --pattern 'vibe-harness-online-evals-*' --dir ".vibe-harness/evals/history/$run_id"
          done
      - name: Enforce online evaluation health
        if: always()
        env:
          VIBE_HARNESS_EVAL_ENFORCE: ${{ vars.VIBE_HARNESS_EVAL_ENFORCE }}
        run: pnpm eval:health --current-dir .vibe-harness/evals/runs --history-dir .vibe-harness/evals/history --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare 7+7 day evidence windows
        if: always()
        run: pnpm eval:compare --history-dir .vibe-harness/evals/history --current-dir .vibe-harness/evals/runs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibe-harness-online-evals-${{ github.run_id }}
          path: .vibe-harness/evals/runs/*.json
          retention-days: 30
          if-no-files-found: error
